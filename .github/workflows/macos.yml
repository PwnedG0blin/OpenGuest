name: Build macOS test app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n Start.command Android_einrichten.command Android_Streaming_einrichten.command scripts/build-app.sh
      - name: Test, compile and package Apple Silicon app
        run: bash scripts/build-app.sh
      - name: Archive test app
        run: /usr/bin/ditto -c -k --sequesterRsrc --keepParent dist/OpenGuest.app dist/OpenGuest-macOS-AppleSilicon.app.zip
      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: OpenGuest-macOS-AppleSilicon-test-app
          path: dist/OpenGuest-macOS-AppleSilicon.app.zip
          if-no-files-found: error
          retention-days: 14
