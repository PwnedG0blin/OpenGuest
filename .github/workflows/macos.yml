name: Build macOS test app
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: bash -n Android_Werkzeuge_einrichten.command Start.command Android_einrichten.command Android_Streaming_einrichten.command Windows_Treiber_einrichten.command scripts/build-app.sh scripts/notarize-app.sh scripts/preview-windows-paste.sh
      - name: Install QEMU and TPM utilities for regression tests
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: |
          command -v qemu-img >/dev/null || brew install qemu
          command -v swtpm >/dev/null || brew install swtpm
      - name: Test, compile and package Apple Silicon app
        env:
          OPENGUEST_REQUIRE_QEMU_TEST: "1"
        run: bash scripts/build-app.sh
      - name: Render paste dialog in light and dark appearance
        run: bash scripts/preview-windows-paste.sh
      - name: Real QEMU TPM initialization regression test
        run: python3 scripts/tpm-smoke.py
      - name: Application launch smoke test
        run: |
          dist/Pixelkoje.app/Contents/MacOS/Pixelkoje > dist/launch-smoke.log 2>&1 &
          app_pid=$!
          trap 'kill -TERM "$app_pid" 2>/dev/null || true' EXIT
          sleep 5
          if ! kill -0 "$app_pid" 2>/dev/null; then
            cat dist/launch-smoke.log
            exit 1
          fi
          echo "App stayed running for 5 seconds on a clean macOS runner. Guest integration is not tested."
      - name: Archive test app
        run: |
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent dist/Pixelkoje.app dist/Pixelkoje-macOS-AppleSilicon.app.zip
          mkdir -p dist/installer
          /usr/bin/ditto dist/Pixelkoje.app dist/installer/Pixelkoje.app
          ln -s /Applications dist/installer/Applications
          /usr/bin/hdiutil create -volname Pixelkoje -srcfolder dist/installer -ov -format UDZO dist/Pixelkoje_0.3.14_AppleSilicon.dmg
      - name: Upload compiled app
        uses: actions/upload-artifact@v7
        with:
          name: Pixelkoje-macOS-AppleSilicon-test-app
          path: |
            dist/Pixelkoje-macOS-AppleSilicon.app.zip
            dist/Pixelkoje_0.3.14_AppleSilicon.dmg
            dist/paste-preview/*.png
          if-no-files-found: error
          retention-days: 14
